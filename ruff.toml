# Ruff configuration for MoneyOS backend.
# Mirrors .editorconfig: 79-char line length, 4-space indent.

line-length = 79
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle (documentation)
    "SIM", # flake8-simplify
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[lint.per-file-ignores]
"tests/*" = ["D"]
"__init__.py" = ["F401", "D104"]
# Alembic migration scripts: `op`/`sa` imports are provided by the template
# and are unused until a migration body is autogenerated.
"**/database/migrations/versions/*.py" = ["F401"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
