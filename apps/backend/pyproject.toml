[project]
name = "moneyos-backend"
version = "0.1.0"
description = "MoneyOS backend API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # Statement framework extractors: PDF (pypdf) and Excel (openpyxl).
    # Previously lazy-imported, now declared so fresh venvs/containers work.
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets plain `async def test_*` run without decorators.
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "requires_postgres: test needs a live PostgreSQL (TEST_DATABASE_URL); skipped otherwise",
]

# Linting/formatting is governed by the repository-root ruff.toml.
