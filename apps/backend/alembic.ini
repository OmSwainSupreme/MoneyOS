# Alembic configuration for MoneyOS.
#
# The database URL is intentionally NOT set here; it is resolved at runtime
# from the application settings (env / .env) inside migrations/env.py so that
# credentials live in one place and are never committed.

[alembic]
# Path to migration scripts. env.py resolves this to an absolute path, so
# commands work from both the repository root and the backend directory.
script_location = database/migrations

# Template used to generate migration file names: <date>_<rev>_<slug>.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Use OS-independent path separators for version locations.
version_path_separator = os

# Detect column type changes during autogenerate.
# (Enforced in env.py via compare_type=True.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
