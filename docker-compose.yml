services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: moneyos_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U db_user']
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    working_dir: /app
    command: npm run preview --workspace @moneyos/frontend -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    working_dir: /app/apps/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app/apps/backend
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://db_user:db_password@postgres:5432/moneyos_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend

volumes:
  postgres_data: